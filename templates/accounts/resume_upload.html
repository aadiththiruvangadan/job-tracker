{% extends 'base.html' %}
{% block title %}Resume{% endblock %}

{% block content %}
<h2>Resume</h2>

{% if profile.resume %}
    <p>Current resume: <a href="{{ profile.resume.url }}" target="_blank">{{ profile.resume.name }}</a></p>
    <p><a href="{{ profile.resume.url }}" download>Download</a></p>
{% else %}
    <p>No resume uploaded yet.</p>
{% endif %}

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if profile.resume %}Replace{% else %}Upload{% endif %} Resume</button>
</form>
{% endblock %}
