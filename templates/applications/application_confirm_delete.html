{% extends 'base.html' %}
{% block title %}Delete Application{% endblock %}

{% block content %}
<h2>Delete "{{ application.job_title }} @ {{ application.company_name }}"?</h2>
<p>This action cannot be undone.</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'application_detail' application.pk %}">Cancel</a>
</form>
{% endblock %}
